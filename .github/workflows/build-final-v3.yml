name: Build FINAL v3 Demi-Plane map

on:
  push:
    paths:
      - FINAL_V3_TRIGGER
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Pillow
        run: python -m pip install --upgrade pip pillow

      - name: Reconstruct final v3 master source
        run: |
          mkdir -p work_final_v3
          cat .source_v3/part*.b64 | tr -d '\n\r ' | base64 --decode > work_final_v3/master_source.jpg
          python - <<'PY'
          from PIL import Image
          p = "work_final_v3/master_source.jpg"
          im = Image.open(p)
          im.verify()
          im = Image.open(p)
          print("source:", im.size, im.mode)
          PY

      - name: Install Real-ESRGAN
        id: install_realesrgan
        continue-on-error: true
        run: |
          python -m pip install torch==2.0.1 torchvision==0.15.2 --index-url https://download.pytorch.org/whl/cpu
          git clone --depth 1 https://github.com/xinntao/Real-ESRGAN.git /tmp/Real-ESRGAN
          cd /tmp/Real-ESRGAN
          python -m pip install -r requirements.txt
          python setup.py develop
          python - <<'PY'
          from pathlib import Path
          try:
              import basicsr
              p = Path(basicsr.__file__).parent / "data" / "degradations.py"
              if p.exists():
                  s = p.read_text()
                  s = s.replace(
                      "from torchvision.transforms.functional_tensor import rgb_to_grayscale",
                      "from torchvision.transforms.functional import rgb_to_grayscale"
                  )
                  p.write_text(s)
          except Exception as e:
              print("patch warning:", e)
          PY
          mkdir -p weights
          wget -q https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.2.4/RealESRGAN_x4plus_anime_6B.pth -O weights/RealESRGAN_x4plus_anime_6B.pth

      - name: AI super-resolution of COMPLETE master
        id: upscale
        continue-on-error: true
        if: steps.install_realesrgan.outcome == 'success'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/work_final_v3/realesrgan"
          cd /tmp/Real-ESRGAN
          python inference_realesrgan.py \
            -n RealESRGAN_x4plus_anime_6B \
            -i "$GITHUB_WORKSPACE/work_final_v3/master_source.jpg" \
            -o "$GITHUB_WORKSPACE/work_final_v3/realesrgan" \
            -s 4 \
            -t 256 \
            --fp32 \
            --ext png

      - name: Export master and 25 seamless tiles
        run: python tools/build_final_v3.py

      - name: Write build report
        run: |
          {
            echo "# FINAL V3 DEMI-PLANE MAP"
            echo
            echo "- New continuous master artwork"
            echo "- AI enhancement result: ${{ steps.upscale.outcome }}"
            echo "- Final master: 12000 x 12000"
            echo "- 25 tiles: 2400 x 2400 each"
            echo "- No tile regeneration"
            echo "- No rotation"
            echo "- 13 = Heartgate Basin"
            echo "- 16 = Veiled Fox Sanctuary"
            echo
            cat final_v3/voyage_links.json
          } > final_v3/BUILD_REPORT.md

      - name: Commit final v3 outputs
        run: |
          rm -rf work_final_v3
          git config user.name "ChatGPT Map Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A final_v3
          git commit -m "Build final v3 seamless Demi-Plane map" || exit 0
          git pull --rebase origin main
          git push origin main
