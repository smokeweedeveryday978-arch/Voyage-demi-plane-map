name: Build final high-resolution Voyage map

on:
  push:
    paths:
      - BUILD_HIGH_RES
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Pillow
        run: python -m pip install --upgrade pip pillow

      - name: Reconstruct the approved master image
        run: |
          mkdir -p work_high_res
          cat .source_chunks/approved_master_png_*.b64 | tr -d '\n\r ' | base64 --decode > work_high_res/master_source.png
          python - <<'PY'
          from PIL import Image
          p = "work_high_res/master_source.png"
          im = Image.open(p)
          im.verify()
          im = Image.open(p)
          print("approved master:", im.size, im.mode)
          PY

      - name: Install Real-ESRGAN
        id: install_realesrgan
        continue-on-error: true
        run: |
          python -m pip install torch==2.0.1 torchvision==0.15.2 --index-url https://download.pytorch.org/whl/cpu
          git clone --depth 1 https://github.com/xinntao/Real-ESRGAN.git /tmp/Real-ESRGAN
          cd /tmp/Real-ESRGAN
          python -m pip install -r requirements.txt
          python setup.py develop
          python - <<'PY'
          from pathlib import Path
          try:
              import basicsr
              p = Path(basicsr.__file__).parent / "data" / "degradations.py"
              if p.exists():
                  s = p.read_text()
                  s = s.replace(
                      "from torchvision.transforms.functional_tensor import rgb_to_grayscale",
                      "from torchvision.transforms.functional import rgb_to_grayscale"
                  )
                  p.write_text(s)
          except Exception as e:
              print("patch warning:", e)
          PY
          mkdir -p weights
          wget -q https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.2.4/RealESRGAN_x4plus_anime_6B.pth -O weights/RealESRGAN_x4plus_anime_6B.pth

      - name: AI super-resolution of the COMPLETE approved master
        id: upscale
        continue-on-error: true
        if: steps.install_realesrgan.outcome == 'success'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/work_high_res/realesrgan"
          cd /tmp/Real-ESRGAN
          python inference_realesrgan.py \
            -n RealESRGAN_x4plus_anime_6B \
            -i "$GITHUB_WORKSPACE/work_high_res/master_source.png" \
            -o "$GITHUB_WORKSPACE/work_high_res/realesrgan" \
            -s 4 \
            -t 256 \
            --fp32 \
            --ext png

      - name: Export final master and exact 5x5 tiles
        run: python tools/build_high_res.py

      - name: Write final build report
        run: |
          {
            echo "# FINAL Voyage Demi-Plane map build"
            echo
            echo "- Source: approved master reconstructed from .source_chunks/approved_master_png_*.b64"
            echo "- AI enhancement result: ${{ steps.upscale.outcome }}"
            echo "- Final master: 12000 x 12000"
            echo "- Every region tile: 2400 x 2400, JPEG quality 100, no chroma subsampling"
            echo "- NO independent tile generation"
            echo "- NO tile rotation"
            echo "- NO vertical inversion"
            echo "- Tile order: top-left -> bottom-right"
            echo
            echo "01 02 03 04 05"
            echo "06 07 08 09 10"
            echo "11 12 13 14 15"
            echo "16 17 18 19 20"
            echo "21 22 23 24 25"
            echo
            echo "16 = Veiled Fox Sanctuary"
            echo "13 = Heartgate Basin"
            echo "21 = The Still Frontier"
            echo "25 = The Veiled Edge"
            echo
            cat voyage_links.json
          } > HIGH_RES_BUILD.md

      - name: Commit final generated map
        run: |
          rm -rf work_high_res
          git config user.name "ChatGPT Map Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A master tiles voyage_links.json HIGH_RES_BUILD.md
          git commit -m "Fix final map orientation and region tile mapping" || exit 0
          git pull --rebase origin main
          git push origin main
